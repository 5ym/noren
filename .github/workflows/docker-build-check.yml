name: Docker Build Check

on:
  pull_request:
    branches: [main]

# GITHUB_TOKEN は読むだけ。upload-artifact と gha キャッシュは ACTIONS_RUNTIME_TOKEN を使うので足りる
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

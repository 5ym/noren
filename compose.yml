# 手元で試すための compose。http://localhost:3000 で開く。
# 秘密(Stripe・SMTP・OIDC)は .env に書く(.env.example を写して埋める)。
services:
  noren:
    build:
      context: .
      args:
        # 平文 http で直に開くので、origin をビルド時に埋め込む (CSRF 判定用)
        ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      - PUBLIC_URL=http://localhost:3000
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/usr/src/app/data
      - files:/usr/src/app/files

volumes:
  data:
  files:
